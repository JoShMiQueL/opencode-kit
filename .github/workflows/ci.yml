name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate agent and command frontmatter
        run: node scripts/validate-agents.mjs

      - name: Installer smoke test
        run: node scripts/test-install.mjs

      - name: CLI help works
        run: node install.mjs --help

      - name: Bash shim parses
        run: bash -n install.sh

      - name: PowerShell shim runs
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./install.ps1 -Version

      - name: cmd shim runs
        if: runner.os == 'Windows'
        shell: cmd
        run: install.cmd --version
